# The public tree's Rust: one workspace, a crate a game file.
[workspace]
members = ["crates/kernel-files", "crates/kernel-memory", "crates/kernel-process", "crates/kernel-registry", "crates/kernel-text", "crates/kernel-time", "crates/kernel-threads", "crates/logical-disc", "crates/mech-game", "crates/mech-launcher", "crates/mech-layer", "crates/mech-logline", "crates/mech-rows", "crates/mech-shell", "crates/mech-swap", "crates/mech-trace", "crates/window"]
resolver = "3"

# The swap's library (crates/mech-swap): no unwinding, and one object of the
# crate's own, as the checker builds its Rust arm; the other crates' profiles
# stand as they were.
[profile.swap]
inherits = "release"
panic = "abort"
lto = true
codegen-units = 1
