# The public tree's Rust: one workspace, a crate a game file.
[workspace]
members = ["crates/mech-game", "crates/mech-launcher", "crates/mech-layer", "crates/mech-rows", "crates/mech-shell", "crates/mech-swap"]
resolver = "3"

# The Windows 95 stand-ins and the trace they report through live in their own
# repository, oxide95; this table is the one place that says where. `mech_trace`
# and `mech_logline` are the ports' own words for its `oxide_trace` and
# `oxide_logline`, so the ports' sources need no change at all.
[workspace.dependencies]
draw = { git = "https://github.com/evanleeturner/oxide95", rev = "5be3d2e124d1a5dd228f5dbc443e093b78f4122e" }
kernel_files = { git = "https://github.com/evanleeturner/oxide95", rev = "5be3d2e124d1a5dd228f5dbc443e093b78f4122e" }
kernel_memory = { git = "https://github.com/evanleeturner/oxide95", rev = "5be3d2e124d1a5dd228f5dbc443e093b78f4122e" }
kernel_process = { git = "https://github.com/evanleeturner/oxide95", rev = "5be3d2e124d1a5dd228f5dbc443e093b78f4122e" }
kernel_registry = { git = "https://github.com/evanleeturner/oxide95", rev = "5be3d2e124d1a5dd228f5dbc443e093b78f4122e" }
kernel_text = { git = "https://github.com/evanleeturner/oxide95", rev = "5be3d2e124d1a5dd228f5dbc443e093b78f4122e" }
kernel_threads = { git = "https://github.com/evanleeturner/oxide95", rev = "5be3d2e124d1a5dd228f5dbc443e093b78f4122e" }
kernel_time = { git = "https://github.com/evanleeturner/oxide95", rev = "5be3d2e124d1a5dd228f5dbc443e093b78f4122e" }
logical_disc = { git = "https://github.com/evanleeturner/oxide95", rev = "5be3d2e124d1a5dd228f5dbc443e093b78f4122e" }
mech_logline = { package = "oxide_logline", git = "https://github.com/evanleeturner/oxide95", rev = "5be3d2e124d1a5dd228f5dbc443e093b78f4122e" }
mech_trace = { package = "oxide_trace", git = "https://github.com/evanleeturner/oxide95", rev = "5be3d2e124d1a5dd228f5dbc443e093b78f4122e" }
window = { git = "https://github.com/evanleeturner/oxide95", rev = "5be3d2e124d1a5dd228f5dbc443e093b78f4122e" }
window-input = { git = "https://github.com/evanleeturner/oxide95", rev = "5be3d2e124d1a5dd228f5dbc443e093b78f4122e" }

# The swap's library (crates/mech-swap): no unwinding, and one object of the
# crate's own, as the checker builds its Rust arm; the other crates' profiles
# stand as they were.
[profile.swap]
inherits = "release"
panic = "abort"
lto = true
codegen-units = 1
