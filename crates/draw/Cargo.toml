# The drawing stand-in's step 1 (DB1, ruling 1422): GDI32's names a program
# asks of its pixels and its palette, and the paint names, behind one seam.
# The buffers, the palette, the contexts and the blits are every target's; only
# the buffer last shown crosses to a back. It builds for any target, the
# browser's included.
[package]
name = "draw"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "warn"

[lints.clippy]
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"

[features]
# The portable part and the fronts, `easel::Easel` and `front::Front`: they
# allocate, so they stay off where no allocator is: the swap under Wine is
# `no_std` with none, and links `draw` through a game's rows crate for the
# rows alone.
desk = ["window/desk"]
# The page's back, `page::Page`: the page's script reads the buffer last shown
# once an animation frame.
page = ["desk"]

[dependencies]
window = { path = "../window" }
mech_trace = { path = "../mech-trace" }
log = { version = "0.4", features = ["kv"] }

[dev-dependencies]
window = { path = "../window", features = ["desk", "page"] }
mech_logline = { path = "../mech-logline" }
