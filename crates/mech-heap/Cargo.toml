# The C library's memory helpers (HC7): malloc, operator new, free,
# operator delete, calloc and realloc, written once over a seam, `Memory`,
# that says where a file's blocks come from. Each call writes one DEBUG line,
# `imp.call`. No target's own names: it builds for any target, the browser's
# included; the Windows heap is `mech-layer`'s backend.
[package]
name = "mech_heap"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "warn"

[lints.clippy]
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"

[dependencies]
mech_trace = { path = "../mech-trace" }
log = { version = "0.4", features = ["kv"] }

[dev-dependencies]
mech_logline = { path = "../mech-logline" }
