<!doctype html>
<!-- SPDX-License-Identifier: MIT -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The launcher</title>
    <script type="module" src="launcher.mjs"></script>
  </head>
  <body>
    <main>
      <h1>The launcher</h1>
      <p id="status" role="status" aria-live="polite" data-state="loading">
        Loading.
      </p>
      <ul id="findings" aria-label="The picked disc's wrong files" hidden></ul>
      <fieldset id="pick" disabled>
        <legend>Pick the disc</legend>
        <p>
          <label for="image"
            >A disc image: the .iso, or the .cue with its .bin files</label
          >
          <input id="image" type="file" multiple accept=".iso,.cue,.bin" />
        </p>
        <p>
          <label for="folder">Or the mounted disc's folder</label>
          <input id="folder" type="file" webkitdirectory />
        </p>
      </fieldset>
      <p>
        <button id="start" type="button" aria-disabled="true">Start</button>
        <button id="save" type="button">Save the page's log</button>
      </p>
    </main>
  </body>
</html>
