# The layer (HC6): a Rust function for each Windows and Miles import the
# shell's screens call, and for each Smacker thunk; each calls the real
# function through Wine and writes one DEBUG line, `imp.call`. Linked into
# the swap's library by `mech-swap`. 32-bit x86 Windows only; on any other
# target the crate is empty.
[package]
name = "mech_layer"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "warn"

[lints.clippy]
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"

[dependencies]
mech_heap = { path = "../mech-heap" }
mech_trace = { path = "../mech-trace" }
log = { version = "0.4", features = ["kv"] }
