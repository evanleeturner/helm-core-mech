# The layer (HC6): a Rust function for each Windows and Miles import the
# shell's screens call, and for each Smacker thunk; each calls the real
# function through Wine and writes one DEBUG line, `imp.call`. Linked into
# the swap's library by `mech-swap`. 32-bit x86 Windows only; on any other
# target the crate is empty.
[package]
name = "mech_layer"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "warn"

[lints.clippy]
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"

[dependencies]
cd-audio = { workspace = true }
sound-mix = { workspace = true }
kernel_files = { workspace = true }
kernel_memory = { workspace = true }
kernel_process = { workspace = true }
kernel_registry = { workspace = true }
kernel_text = { workspace = true }
kernel_threads = { workspace = true }
kernel_time = { workspace = true }
mech_rows = { path = "../mech-rows" }
mech_trace = { workspace = true }
draw = { workspace = true, features = ["user32"] }
draw-surfaces = { workspace = true, features = ["desk"] }
window = { workspace = true, features = ["user32"] }
window-input = { workspace = true, features = ["user32"] }
log = { version = "0.4", features = ["kv"] }

[dev-dependencies]
mech_logline = { workspace = true }

# The Wine test is a program of its own, no test harness: its `off` case sets the
# logger's level for the whole program, so the cases run in order on one thread.
# It compiles `src/through.rs` into itself and links no part of this library.
[[test]]
name = "through"
harness = false
