# mercs's rows (ruling 1389): the game's facts the Kernel stand-in reads, a
# module a step, constants only: `memory` for kernel_memory's helpers, `files`
# for kernel_files' seam, `disc` for logical_disc. Its harvested logs and the tests that replay them
# test the stand-in on this game. No target's own names: it builds for any
# target, the browser's included.
[package]
name = "mech_rows"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "warn"

[lints.clippy]
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"

[dependencies]
kernel_files = { path = "../kernel-files" }
kernel_memory = { path = "../kernel-memory" }
logical_disc = { path = "../logical-disc" }

[dev-dependencies]
kernel_files = { path = "../kernel-files", features = ["memory"] }
logical_disc = { path = "../logical-disc", features = ["disc"] }
mech_logline = { path = "../mech-logline" }
log = { version = "0.4", features = ["kv"] }
