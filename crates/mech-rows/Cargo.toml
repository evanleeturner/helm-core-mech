# mercs's rows (ruling 1389): the game's facts the Kernel stand-in reads, a
# module a step, constants only: `memory` for kernel_memory's helpers, `files`
# for kernel_files' seam, `disc` for logical_disc, `time` for kernel_time's,
# `threads` for kernel_threads', `process` for kernel_process's, `registry` for kernel_registry's, `window` for window's, `dialogs` for window-dialogs', `input` for
# window-input's, `draw` for draw's, `surfaces` for draw-surfaces'. Its
# harvested logs and the tests that replay them
# test the stand-in on this game. No target's own names: it builds for any
# target, the browser's included.
[package]
name = "mech_rows"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "warn"

[lints.clippy]
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"

[dependencies]
draw = { workspace = true }
draw-surfaces = { workspace = true }
kernel_files = { workspace = true }
kernel_memory = { workspace = true }
kernel_process = { workspace = true }
kernel_registry = { workspace = true }
kernel_text = { workspace = true }
kernel_threads = { workspace = true }
kernel_time = { workspace = true }
logical_disc = { workspace = true }
window = { workspace = true }
window-dialogs = { workspace = true }
window-input = { workspace = true }

[dev-dependencies]
draw = { workspace = true, features = ["desk"] }
draw-surfaces = { workspace = true, features = ["desk"] }
kernel_files = { workspace = true, features = ["memory"] }
kernel_registry = { workspace = true, features = ["page", "std"] }
kernel_threads = { workspace = true, features = ["page", "std"] }
logical_disc = { workspace = true, features = ["disc"] }
window = { workspace = true, features = ["desk", "page"] }
window-dialogs = { workspace = true, features = ["plant"] }
kernel_process = { workspace = true, features = ["plant"] }
window-input = { workspace = true, features = ["desk"] }
mech_logline = { workspace = true, features = ["fence"] }
log = { version = "0.4", features = ["kv"] }
