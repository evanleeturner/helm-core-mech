# The shell library's functions in Rust, ported from the decompile's Rust:
# RT1's 20 with each global an owned field, DEBUG logs, and tests harvested
# from the original under Wine; RT2 and RT3's 488 copied unchanged,
# HC6's 61 ported by RT3's route and its 31 from the decompiler's output,
# 32-bit x86 only, as their calling conventions are.
[package]
name = "mech_shell"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "warn"

[lints.clippy]
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"

[dependencies]
mech_trace = { workspace = true }
log = "0.4"

[dev-dependencies]
mech_logline = { workspace = true }
