# The starter: runs a Windows program with a library bound in from its first
# instruction, no debugger and no file changed. It names no game.
# 32-bit x86 Windows only; on any other target the program is empty and the
# library its host-tested reading. Build it with `cargo rustc -p mech_start
# --profile swap --bin mech-start --target i686-pc-windows-gnu -- -C linker=rust-lld
# -C linker-flavor=ld.lld -C link-self-contained=no -C link-arg=-e -C
# link-arg=_start@0 -C link-arg=--subsystem -C link-arg=console -L <mingw-w64's
# import libraries>`, with `-L` rust-mingw's where the toolchain has them.
[package]
name = "mech_start"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[[bin]]
name = "mech-start"
path = "src/main.rs"
# `no_std` with `panic = "abort"` on its one real target: no test form; the library holds the tests.
test = false

[lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "warn"

[lints.clippy]
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"
