# The swap: the shell library's 580 ported functions in one library the live
# game loads beside its own (HC5), each exported as HC5_<address>, its
# globals and callees linked to the shell's own addresses by the swap's
# build. 32-bit x86 Windows only; on any other target the crate is its
# sink's line alone, for the host test. Build it with
# `cargo rustc -p mech_swap --profile swap --target i686-pc-windows-gnu
# --crate-type staticlib`.
[package]
name = "mech_swap"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "warn"

[lints.clippy]
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"

[dependencies]
mech_layer = { path = "../mech-layer" }
mech_trace = { workspace = true }
log = { version = "0.4", features = ["kv"] }

[dev-dependencies]
mech_logline = { workspace = true }
